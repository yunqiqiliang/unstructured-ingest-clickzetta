name: Simple Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for exposed secrets
        run: |
          echo "🔍 Scanning for potential secrets..."
          
          # 创建临时文件记录发现
          found_issues=0
          
          # 检查AWS密钥
          echo "Checking for AWS keys..."
          if grep -rE "AKIA[0-9A-Z]{16}" --include="*.py" --include="*.json" --include="*.yml" --exclude-dir=".git" --exclude-dir="node_modules" . 2>/dev/null; then
            echo "⚠️ Found potential AWS Access Keys"
            found_issues=$((found_issues + 1))
          fi
          
          # 检查私钥
          echo "Checking for private keys..."
          if grep -r "BEGIN.*PRIVATE KEY" --include="*.py" --include="*.json" --exclude-dir=".git" . 2>/dev/null; then
            echo "⚠️ Found private key patterns"
            found_issues=$((found_issues + 1))
          fi
          
          # 检查.env文件
          echo "Checking for .env files..."
          env_files=$(find . -name "*.env" -o -name ".env*" | grep -v ".git" | grep -v ".github" | grep -v ".envrc" | grep -v "node_modules" || true)
          if [ ! -z "$env_files" ]; then
            echo "⚠️ Found .env files:"
            echo "$env_files"
            found_issues=$((found_issues + 1))
          fi
          
          # 检查硬编码密码
          echo "Checking for hardcoded passwords..."
          if grep -rE "(password|passwd|pwd)\s*=\s*['\"][^'\"]{8,}['\"]" --include="*.py" --include="*.js" --include="*.json" --exclude-dir=".git" --exclude-dir="test" . 2>/dev/null | grep -v "example" | grep -v "template"; then
            echo "⚠️ Found potential hardcoded passwords"
            found_issues=$((found_issues + 1))
          fi
          
          if [ $found_issues -eq 0 ]; then
            echo "✅ No obvious secrets found!"
          else
            echo "⚠️ Found $found_issues potential issues - please review"
            # 不要失败构建，只是警告
            exit 0
          fi

  python-check:
    name: Python Code Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check Python files
        run: |
          echo "📊 Repository statistics:"
          echo "Python files: $(find . -name "*.py" -type f | wc -l)"
          echo "Total lines: $(find . -name "*.py" -type f -exec wc -l {} + | tail -n 1 | awk '{print $1}')"
          echo "✅ Basic checks completed"