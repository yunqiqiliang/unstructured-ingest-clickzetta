name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # 每周一早上8点运行
    - cron: '0 8 * * 1'

jobs:
  secret-scan:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史以扫描所有提交

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  docker-scan:
    name: Scan Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -f Dockerfile.webui -t security-scan:latest .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'security-scan:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check for hardcoded secrets
        run: |
          # 检查常见的硬编码密钥模式
          echo "Checking for hardcoded secrets..."
          
          # AWS Keys
          if grep -rE "AKIA[0-9A-Z]{16}" --include="*.py" --include="*.yml" --include="*.yaml" --include="*.json" --exclude-dir=".git" .; then
            echo "❌ Found potential AWS keys"
            exit 1
          fi
          
          # Private Keys
          if grep -r "BEGIN.*PRIVATE KEY" --include="*.py" --include="*.yml" --include="*.yaml" --exclude-dir=".git" .; then
            echo "❌ Found private keys"
            exit 1
          fi
          
          # 检查.env文件是否被意外包含
          if find . -name "*.env" -o -name ".env*" | grep -v ".envrc" | grep -v ".git"; then
            echo "❌ Found .env files that should not be committed"
            exit 1
          fi
          
          echo "✅ No obvious secrets found"

  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install safety
        run: pip install safety

      - name: Check Python dependencies
        run: |
          pip install -r requirements.txt
          safety check --json
        continue-on-error: true  # 不阻塞构建，但报告问题